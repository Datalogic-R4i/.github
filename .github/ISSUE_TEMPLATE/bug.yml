name: Bug
description: Something that worked or should work does not. Opened in the repository where the defect lives
type: Bug
projects: ["Datalogic-R4i/3"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The observed behaviour, with error messages or logs if you have them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where and since when
      description: Installation or customer, version, since when, how often. Steps to reproduce if known.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: >-
        Your proposal; the Product Owner confirms it on the board. It decides how fast the bug is
        handled (working agreement, Bugs and severity): S1 enters the current sprint at once.
      options:
        - S1 Critical - blocks a customer in production with no workaround, or loses or exposes data
        - S2 Major - degrades a customer installation, with a workaround
        - S3 Minor - minor, or found in test
    validations:
      required: true
